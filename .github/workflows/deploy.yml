name: Deploy server

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [dev, staging, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable server image
        run: docker build --tag kingdom-server:${GITHUB_SHA} .
      - name: Authenticate to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push service images
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for service in api realtime worker; do
            repository="kingdom-${ENVIRONMENT}-${service}"
            docker tag "kingdom-server:${GITHUB_SHA}" "${REGISTRY}/${repository}:${GITHUB_SHA}"
            docker push "${REGISTRY}/${repository}:${GITHUB_SHA}"
          done
      - name: Plan infrastructure and service revision
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.environment }}/platform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="dynamodb_table=${{ secrets.TERRAFORM_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
          terraform plan \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var="image_tag=${GITHUB_SHA}" \
            -out=tfplan
      - name: Apply approved plan
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan
