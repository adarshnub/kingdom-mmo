name: kingdom-mmo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kingdom
      POSTGRES_PASSWORD: kingdom_local_only
      POSTGRES_DB: kingdom_local
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kingdom -d kingdom_local']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kingdom
      MINIO_ROOT_PASSWORD: kingdom-local-only
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 kingdom kingdom-local-only
        mc mb --ignore-existing local/kingdom-assets-local
        mc anonymous set download local/kingdom-assets-local
    restart: 'no'

  caddy:
    image: caddy:2.10-alpine
    profiles: ['proxy']
    ports:
      - '8080:8080'
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.129.1
    profiles: ['observability']
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: ['observability']
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:3.5.1
    profiles: ['observability']
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - '3100:3100'

  grafana:
    image: grafana/grafana:12.0.2
    profiles: ['observability']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: kingdom-local-only
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3030:3000'
    depends_on:
      - prometheus
      - loki

  pgadmin:
    image: dpage/pgadmin4:9.4
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kingdom.local
      PGADMIN_DEFAULT_PASSWORD: kingdom-local-only
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.26
    profiles: ['tools']
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:
